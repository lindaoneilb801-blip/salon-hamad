<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صالون الكوافير حمد - VIP Booking</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #070304;
            --bg-card: rgba(22, 9, 14, 0.9);
            --primary-maroon: #7a001e;
            --bright-maroon: #b3002d;
            --maroon-glow: rgba(179, 0, 45, 0.4);
            --accent-gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #f8f9fa;
            --text-muted: #a3999e;
            --border-glow: rgba(212, 175, 55, 0.3);
            --card-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Readex Pro', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(122, 0, 30, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(179, 0, 45, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.95) 0%, #070304 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        /* Container */
        .app-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 15px;
        }

        /* Header Admin Control */
        .admin-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .admin-reset-btn {
            background: rgba(122, 0, 30, 0.3);
            border: 1px solid var(--primary-maroon);
            color: var(--gold-light);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-reset-btn:hover {
            background: var(--primary-maroon);
            color: #fff;
            box-shadow: 0 0 12px var(--maroon-glow);
        }

        .hero-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: var(--card-radius);
