<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صالون الكوافير حمد - VIP Booking</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0507;
            --bg-card: rgba(26, 11, 17, 0.85);
            --primary-maroon: #800020;
            --bright-maroon: #b3002d;
            --maroon-glow: rgba(179, 0, 45, 0.4);
            --accent-gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #f8f9fa;
            --text-muted: #a3999e;
            --border-glow: rgba(212, 175, 55, 0.3);
            --card-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Readex Pro', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(128, 0, 32, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(179, 0, 45, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.9) 0%, #0a0507 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        /* Container */
        .app-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 15px;
        }

        /* Header Admin Control */
        .admin-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .admin-reset-btn {
            background: rgba(128, 0, 32, 0.3);
            border: 1px solid var(--primary-maroon);
            color: var(--gold-light);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-reset-btn:hover {
            background: var(--primary-maroon);
            color: #fff;
            box-shadow: 0 0 12px var(--maroon-glow);
        }

        /* HERO SECTION */
        .hero-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: var(--card-radius);
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(128, 0, 32, 0.3);
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .hero-img-wrapper {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hero-img {
            width: 100%;
            height: auto;
            max-height: 550px;
            object-fit: contain;
            display: block;
        }

        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(10, 5, 7, 0.95) 10%, rgba(10, 5, 7, 0.4) 60%, transparent 100%);
            padding: 30px 20px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-title {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, var(--gold-light) 50%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .btn-book-now {
            background: linear-gradient(135deg, var(--bright-maroon) 0%, var(--primary-maroon) 100%);
            color: #fff;
            border: 1px solid var(--accent-gold);
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--maroon-glow), inset 0 0 10px rgba(212, 175, 55, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-book-now:hover, .btn-book-now:active {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(179, 0, 45, 0.7), inset 0 0 15px rgba(212, 175, 55, 0.5);
        }

        /* SECTION TITLES */
        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gold-light);
            margin: 30px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-right: 5px;
        }

        .section-title i {
            color: var(--bright-maroon);
            font-size: 1.1rem;
            filter: drop-shadow(0 0 5px var(--bright-maroon));
        }

        /* BARBERS GRID (SIDE BY SIDE) */
        .barbers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .barber-card {
            background: var(--bg-card);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: var(--card-radius);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
