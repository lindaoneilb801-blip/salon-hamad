<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صالون الكوافير حمد | VIP Barber Booking</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Premium Arabic Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900;1000&family=Changa:wght@700;800&family=Reem+Kufi:wght@700;800;900&family=Tajawal:wght@800;900&display=swap" rel="stylesheet">

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        maroon: {
                            300: '#FF6B8B',
                            400: '#E61C40',
                            500: '#C2002B',
                            600: '#800020',
                            700: '#520015',
                            800: '#33000D',
                            900: '#1A0006',
                        },
                        gold: '#FFD700',
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        kufi: ['Reem Kufi', 'sans-serif'],
                        changa: ['Changa', 'sans-serif'],
                        tajawal: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #050203;
            color: #FFF5F7;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: linear-gradient(165deg, rgba(26, 0, 6, 0.9) 0%, rgba(10, 2, 4, 0.95) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1.5px solid rgba(194, 0, 43, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.95), inset 0 1px 1px rgba(255, 107, 139, 0.25);
        }

        .selectable-box {
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(128, 0, 32, 0.45);
            background: linear-gradient(145deg, rgba(20, 3, 7, 0.95), rgba(40, 5, 14, 0.85));
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .selectable-box:hover:not(.booked-slot) {
            border-color: rgba(230, 28, 64, 0.9);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 10px 25px rgba(194, 0, 43, 0.4);
        }

        .selectable-box.selected {
            border-color: #FF6B8B !important;
            background: linear-gradient(135deg, rgba(194, 0, 43, 0.95) 0%, rgba(128, 0, 32, 0.95) 100%) !important;
            box-shadow: 0 0 30px rgba(230, 28, 64, 0.85) !important;
        }

        .selectable-box.booked-slot {
            background: rgba(30, 10, 15, 0.6) !important;
            border-color: rgba(80, 20, 30, 0.5) !important;
            opacity: 0.5;
            cursor: not-allowed !important;
            transform: none !important;
        }

        .btn-flame {
            background: linear-gradient(135deg, #FF1A40 0%, #C2002B 50%, #66001A 100%);
            box-shadow: 0 8px 30px rgba(194, 0, 43, 0.6);
            transition: all 0.35s ease;
        }

        .btn-flame:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 40px rgba(230, 28, 64, 0.85);
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
